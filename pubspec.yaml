name: besties_notes
description: "Mobile app for teacher's notes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  # Keep in lockstep with drift_dev, which bloc_lint's analyzer cap holds at
  # 2.34.0; a newer runtime breaks `drift_dev make-migrations`.
  drift: 2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  image_picker: ^1.2.1
  path: ^1.9.1
  go_router: ^18.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Caprasimo.txt
    - assets/fonts/OFL-Karla.txt

  # Bundled rather than fetched at runtime: the app must work offline.
  fonts:
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/Caprasimo-Regular.ttf
    - family: Karla
      fonts:
        - asset: assets/fonts/Karla-Variable.ttf
