name: besties_notes
description: "Mobile app for teacher's notes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  drift: 2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  image_picker: ^1.2.1
  path: ^1.9.1
  go_router: ^18.0.2
  intl: ^0.20.2
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  package_info_plus: ^10.2.2
  sqlite3: ^3.5.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    - assets/fonts/OFL-YesevaOne.txt
    - assets/fonts/OFL-Nunito.txt

  # Bundled rather than fetched at runtime: the app must work offline.
  # Both cover Latin and Cyrillic (English and Ukrainian UI, any names).
  fonts:
    - family: YesevaOne
      fonts:
        - asset: assets/fonts/YesevaOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
